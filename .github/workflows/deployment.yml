name: Deployment Run

on:
  schedule:
    - cron: '0 */23 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run'
        required: true
        default: 'staging'
        type: choice
        options: [staging, qawolf2]
      workflow-folder:
        required: false
        default: ''
      test-file:
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install
      - run: npx playwright install

      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.env }}" = "staging" ]; then
            echo "DEFAULT_URL=${{ secrets.STAGING_DEFAULT_URL }}" >> $GITHUB_ENV
            echo "DEFAULT_URL_2=${{ secrets.STAGING_DEFAULT_URL_2 }}" >> $GITHUB_ENV
            echo "DEFAULT_URL_3=${{ secrets.STAGING_DEFAULT_URL_3 }}" >> $GITHUB_ENV
            echo "INTERNAL_PDF_VIEWER=${{ secrets.STAGING_INTERNAL_PDF_VIEWER }}" >> $GITHUB_ENV
            echo "DEFAULT_LOGIN=${{ secrets.STAGING_DEFAULT_LOGIN }}" >> $GITHUB_ENV
            echo "DEFAULT_PASSWORD=${{ secrets.STAGING_DEFAULT_PASSWORD }}" >> $GITHUB_ENV
            echo "DEFAULT_PASS_JUNE_2025=${{ secrets.STAGING_DEFAULT_PASS_JUNE_2025 }}" >> $GITHUB_ENV
            echo "DEFAULT_PASS_OCT_2025=${{ secrets.STAGING_DEFAULT_PASS_OCT_2025 }}" >> $GITHUB_ENV
            echo "QAWA_API_KEY=${{ secrets.STAGING_QAWA_API_KEY }}" >> $GITHUB_ENV
          else
            echo "DEFAULT_URL=${{ secrets.QAWOLF2_DEFAULT_URL }}" >> $GITHUB_ENV
            echo "DEFAULT_URL_2=${{ secrets.QAWOLF2_DEFAULT_URL_2 }}" >> $GITHUB_ENV
            echo "DEFAULT_LOGIN=${{ secrets.QAWOLF2_DEFAULT_LOGIN }}" >> $GITHUB_ENV
            echo "DEFAULT_PASSWORD=${{ secrets.QAWOLF2_DEFAULT_PASSWORD }}" >> $GITHUB_ENV
            echo "DEFAULT_PASS_JUNE_2025=${{ secrets.QAWOLF2_DEFAULT_PASS_JUNE_2025 }}" >> $GITHUB_ENV
            echo "DEFAULT_PASS_OCT_2025=${{ secrets.QAWOLF2_DEFAULT_PASS_OCT_2025 }}" >> $GITHUB_ENV
            echo "QAWA_API_KEY=${{ secrets.QAWOLF2_QAWA_API_KEY }}" >> $GITHUB_ENV
          fi

      - name: Run Playwright Tests
        run: |
          if [ -n "${{ github.event.inputs.test-file }}" ]; then
            npx playwright test workflows/${{ github.event.inputs.env }}/${{ github.event.inputs.test-file }}
          elif [ -n "${{ github.event.inputs.workflow-folder }}" ]; then
            npx playwright test workflows/${{ github.event.inputs.env }}/${{ github.event.inputs.workflow-folder }}
          else
            npx playwright test --project=${{ github.event.inputs.env }}
          fi

      - uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ github.event.inputs.env }}
          path: test-results/