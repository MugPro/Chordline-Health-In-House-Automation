name: Deployment Run

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run'
        required: true
        default: 'staging'
        type: choice
        options: [staging, qawolf2]
      workflow-folder:
        description: 'Optional workflow folder to run'
        required: false
        default: ''
      test-file:
        description: 'Optional individual test file to run'
        required: false
        default: ''

jobs:
  test-staging:
    if: github.event.inputs.env == 'staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Set Environment Variables (STAGING)
        run: |
          echo "DEFAULT_URL=${{ secrets.STAGING_DEFAULT_URL }}" >> $GITHUB_ENV
          echo "DEFAULT_URL_2=${{ secrets.STAGING_DEFAULT_URL_2 }}" >> $GITHUB_ENV
          echo "DEFAULT_URL_3=${{ secrets.STAGING_DEFAULT_URL_3 }}" >> $GITHUB_ENV
          echo "INTERNAL_PDF_VIEWER=${{ secrets.STAGING_INTERNAL_PDF_VIEWER }}" >> $GITHUB_ENV
          echo "DEFAULT_LOGIN=${{ secrets.STAGING_DEFAULT_LOGIN }}" >> $GITHUB_ENV
          echo "DEFAULT_PASSWORD=${{ secrets.STAGING_DEFAULT_PASSWORD }}" >> $GITHUB_ENV
          echo "DEFAULT_PASS_JUNE_2025=${{ secrets.STAGING_DEFAULT_PASS_JUNE_2025 }}" >> $GITHUB_ENV
          echo "DEFAULT_PASS_OCT_2025=${{ secrets.STAGING_DEFAULT_PASS_OCT_2025 }}" >> $GITHUB_ENV
          echo "QAWA_API_KEY=${{ secrets.STAGING_QAWA_API_KEY }}" >> $GITHUB_ENV

      - name: Run Playwright Tests
        run: |
          if [ -n "${{ github.event.inputs.test-file }}" ]; then
            npx playwright test workflows/staging/${{ github.event.inputs.test-file }}
          elif [ -n "${{ github.event.inputs.workflow-folder }}" ]; then
            npx playwright test workflows/staging/${{ github.event.inputs.workflow-folder }}
          else
            npx playwright test --project=staging
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-deployment-staging
          path: test-results/

  test-qawolf2:
    if: github.event.inputs.env == 'qawolf2'
    runs-on: [self-hosted, qawolf2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install

      - name: Set Environment Variables (QAWOLF2)
        run: |
          echo "DEFAULT_URL=${{ secrets.QAWOLF2_DEFAULT_URL }}" >> $GITHUB_ENV
          echo "DEFAULT_URL_2=${{ secrets.QAWOLF2_DEFAULT_URL_2 }}" >> $GITHUB_ENV
          echo "DEFAULT_LOGIN=${{ secrets.QAWOLF2_DEFAULT_LOGIN }}" >> $GITHUB_ENV
          echo "DEFAULT_PASSWORD=${{ secrets.QAWOLF2_DEFAULT_PASSWORD }}" >> $GITHUB_ENV
          echo "DEFAULT_PASS_JUNE_2025=${{ secrets.QAWOLF2_DEFAULT_PASS_JUNE_2025 }}" >> $GITHUB_ENV
          echo "DEFAULT_PASS_OCT_2025=${{ secrets.QAWOLF2_DEFAULT_PASS_OCT_2025 }}" >> $GITHUB_ENV
          echo "QAWA_API_KEY=${{ secrets.QAWOLF2_QAWA_API_KEY }}" >> $GITHUB_ENV

      - name: Run Playwright Tests
        run: |
          if [ -n "${{ github.event.inputs.test-file }}" ]; then
            npx playwright test workflows/qawolf2/${{ github.event.inputs.test-file }}
          elif [ -n "${{ github.event.inputs.workflow-folder }}" ]; then
            npx playwright test workflows/qawolf2/${{ github.event.inputs.workflow-folder }}
          else
            npx playwright test --project=qawolf2
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-deployment-qawolf2
          path: test-results/